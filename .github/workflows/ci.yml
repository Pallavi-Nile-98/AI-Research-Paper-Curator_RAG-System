# =============================================================================
# Continuous integration.
#
# Runs on every push to main and every pull request. Two jobs run in parallel:
# one for code quality, one for tests, so a formatting failure and a test
# failure are reported together rather than one hiding the other.
#
# The quality job runs the SAME pre-commit hooks used locally rather than
# re-declaring ruff and mypy invocations here. Duplicating them would let the
# two drift, producing the worst outcome: CI failing on something that passed
# locally, for reasons not visible in either file.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Least privilege: this workflow only reads the repository. It cannot push,
# comment, or alter releases even if a dependency were compromised.
permissions:
  contents: read

# Cancel superseded runs. Pushing twice in quick succession should not leave an
# obsolete run consuming a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the local virtualenv and the Docker base image. Testing a version
  # that cannot be reproduced locally makes failures hard to debug.
  PYTHON_VERSION: "3.13"

jobs:
  quality:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          # Keyed on the config file: change a hook version and the cache is
          # correctly invalidated rather than serving a stale environment.
          key: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        # --show-diff-on-failure prints what an auto-fixing hook changed, so a
        # formatting failure is actionable from the log alone.
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        # Installs the package rather than running against the source tree. With
        # the src layout this is required, and it means CI exercises exactly what
        # a user or a container would get. See ADR-0005.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        # Integration and evaluation tests are excluded: the first needs
        # Postgres, OpenSearch and Ollama running, the second loads models and
        # takes minutes. Both are run locally and will get their own workflow
        # with service containers once they exist.
        run: pytest -m "not integration and not evaluation" --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        # if: always() so the report is available even when tests fail, which is
        # exactly when it is most useful.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn
