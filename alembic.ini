# Alembic configuration.
#
# Deliberately minimal. In particular there is NO sqlalchemy.url here: the
# database URL is read from the application's settings in migrations/env.py, so
# there is exactly one place that knows how to build a connection string and no
# credential is ever written to a tracked file.
#
# Usage (from the repository root):
#   alembic upgrade head                      apply all pending migrations
#   alembic downgrade -1                      undo the most recent migration
#   alembic current                           show the applied revision
#   alembic history --verbose                 list all revisions
#   alembic revision --autogenerate -m "..."  draft a migration from model changes
#
# Autogenerate drafts a migration; it does not write one for you. Always read
# the generated file before applying it -- Alembic cannot detect a table or
# column rename and will emit a drop plus a create, which destroys data.

[alembic]
script_location = migrations

# Makes `import paper_curator` work even without an editable install.
prepend_sys_path = src

# Timestamped filenames sort chronologically in a directory listing, which the
# default bare-hash naming does not.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Revision timestamps in UTC, so migration ordering does not depend on the
# timezone of whoever generated them.
timezone = UTC
